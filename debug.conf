# Optional: easier on-device debugging. Combine with other files, e.g.:
#   west build -b <board> -d build . -- -DEXTRA_CONF_FILE="debug.conf;rtt.conf"
CONFIG_DEBUG_THREAD_INFO=y    # lets the J-Link GDB server's Zephyr plugin list threads
CONFIG_THREAD_NAME=y          # readable thread names in the debugger
CONFIG_DEBUG_OPTIMIZATIONS=y  # no -Os: stepping follows the source, fewer "optimized out" values
