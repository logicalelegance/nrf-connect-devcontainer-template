# Optional: send console and log output through the J-Link (SEGGER RTT) instead of a serial port.
# Useful for boards without a USB serial port. Enable it by adding this file to a build:
#   west build -b <board> -d build . -- -DEXTRA_CONF_FILE=rtt.conf
# View the output while scripts/jlink-gdb-server.sh runs: VS Code task "RTT console".
CONFIG_USE_SEGGER_RTT=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=n
CONFIG_LOG=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n
