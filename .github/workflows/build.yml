# Reusable build: makes sure the toolchain image exists, then builds the firmware and
# runs the unit tests inside it with the same commands as the README and VS Code tasks.
# Called by ci.yml (and later by a release workflow).
name: Build

on:
  workflow_call:

jobs:
  image:
    name: Toolchain image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      # The tag is a hash of everything that goes into the image, so a new image is
      # built only when the toolchain or the NCS revision changes.
      - name: Compute image tag
        id: tag
        run: |
          HASH=$(cat docker/Dockerfile docker/install-toolchain.sh west.yml | sha256sum | cut -c1-16)
          echo "ref=ghcr.io/${{ github.repository }}:toolchain-${HASH}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (skipped if it already exists)
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "Image $REF already exists"
          else
            docker build -f docker/Dockerfile -t "$REF" \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
            docker push "$REF"
          fi

  firmware:
    name: Firmware and unit tests
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image runs as user dev (uid 1000); the runner checks out as a different uid.
      - name: Give the container user ownership of the checkout
        run: sudo chown -R 1000:1000 .

      - name: Build firmware
        run: |
          docker run --rm -v "$PWD":/workdir/app "$IMAGE" west build -b nrf52840dk/nrf52840 -d build .
          sha256sum build/app/zephyr/zephyr.elf build/app/zephyr/zephyr.hex

      - name: Run unit tests
        run: docker run --rm -v "$PWD":/workdir/app "$IMAGE" west twister -T tests -p native_sim/native/64 --outdir twister-out

      - uses: actions/upload-artifact@v7
        with:
          name: firmware
          path: |
            build/app/zephyr/zephyr.elf
            build/app/zephyr/zephyr.hex

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: twister-out/twister_report.xml
