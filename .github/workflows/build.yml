# Reusable build: makes sure the toolchain image exists, then builds the firmware and
# runs the unit tests inside it with the same commands as the README and VS Code tasks.
# Called by ci.yml (every push) and release.yml (version tags).
name: Build

on:
  workflow_call:
    outputs:
      image:
        description: Toolchain image used, pinned by digest (ghcr.io/...@sha256:...)
        value: ${{ jobs.image.outputs.pinned }}
      suffix:
        description: Artifact name suffix, <version>-<12-char git hash>
        value: ${{ jobs.firmware.outputs.suffix }}

jobs:
  image:
    name: Toolchain image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.tag.outputs.ref }}
      pinned: ${{ steps.digest.outputs.pinned }}
    steps:
      - uses: actions/checkout@v7

      # The tag is a hash of everything that goes into the image, so a new image is
      # built only when the toolchain or the NCS revision changes.
      - name: Compute image tag
        id: tag
        run: |
          HASH=$(cat docker/Dockerfile docker/install-toolchain.sh west.yml | sha256sum | cut -c1-16)
          echo "ref=ghcr.io/${{ github.repository }}:toolchain-${HASH}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image (skipped if it already exists)
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          if docker manifest inspect "$REF" > /dev/null 2>&1; then
            echo "Image $REF already exists"
          else
            docker build -f docker/Dockerfile -t "$REF" \
              --label org.opencontainers.image.source=https://github.com/${{ github.repository }} .
            docker push "$REF"
          fi

      - name: Record image digest
        id: digest
        env:
          REF: ${{ steps.tag.outputs.ref }}
        run: |
          DIGEST=$(docker buildx imagetools inspect "$REF" --format '{{.Manifest.Digest}}')
          echo "pinned=${REF%%:*}@${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Image: ${REF%%:*}@${DIGEST}"

  firmware:
    name: Firmware and unit tests
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    outputs:
      suffix: ${{ steps.name.outputs.suffix }}
    env:
      IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      # No saved token: the checkout is handed to the container user below, so
      # checkout's end-of-job token cleanup couldn't edit .git/config anyway.
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The image runs as user dev (uid 1000); the runner checks out as a different uid.
      - name: Give the container user ownership of the checkout
        run: sudo chown -R 1000:1000 .

      - name: Build firmware
        run: |
          docker run --rm -v "$PWD":/workdir/app "$IMAGE" west build -b nrf52840dk/nrf52840 -d build .
          sha256sum build/app/zephyr/zephyr.elf build/app/zephyr/zephyr.hex

      # Version as compiled into the firmware (from the VERSION file, read from the header
      # Zephyr generates) plus the 12-character commit hash.
      - name: Name this build
        id: name
        run: |
          HEADER=build/app/zephyr/include/generated/zephyr/app_version.h
          VERSION=$(sed -n 's/^#define APP_VERSION_STRING *"\(.*\)"$/\1/p' "$HEADER")
          test -n "$VERSION"
          echo "suffix=${VERSION}-${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
          echo "Build: ${VERSION}-${GITHUB_SHA::12}"

      - name: Run unit tests
        run: docker run --rm -v "$PWD":/workdir/app "$IMAGE" west twister -T tests -p native_sim/native/64 --outdir twister-out

      - uses: actions/upload-artifact@v7
        with:
          name: firmware-${{ steps.name.outputs.suffix }}
          path: |
            build/app/zephyr/zephyr.elf
            build/app/zephyr/zephyr.hex

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results-${{ steps.name.outputs.suffix }}
          path: twister-out/twister_report.xml
